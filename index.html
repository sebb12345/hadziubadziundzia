<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Hadziubadziundzia – a Polish neologism. Definition, usage, origin, and linguistic notes." />
<title>Hadziubadziundzia – Independent Polish Lexicon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #5e35b1;
  --bg: #f9fafb;
  --card: #ffffff;
  --text: #1f2933;
  --muted: #6b7280;
  --border: #e5e7eb;
}

[data-theme="dark"] {
  --accent: #b39ddb;
  --bg: #0b1020;
  --card: #131a2a;
  --text: #e6ebf5;
  --muted: #aab3c5;
  --border: #24304a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  transition: background 0.3s, color 0.3s;
}

main {
  width: 90%;
  max-width: 780px;
  margin: 64px auto;
  padding: 24px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
}

.controls {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

.btn {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 0.8rem;
}

.logo {
  text-align: center;
  margin-bottom: 32px;
}

.logo-mark {
  display: inline-flex;
  align-items: center;
  font-family: "Playfair Display", serif;
  font-size: 1.3rem;
  letter-spacing: 0.25em;
  color: var(--accent);
}

.logo-icon {
  width: 28px;
  height: 28px;
  background: var(--accent);
  mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="white" d="M32 0a32 32 0 1032 32A32 32 0 0032 0zm0 4a28 28 0 1128 28A28 28 0 0132 4z"/></svg>') no-repeat center;
  -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="white" d="M32 0a32 32 0 1032 32A32 32 0 0032 0zm0 4a28 28 0 1128 28A28 28 0 0132 4z"/></svg>') no-repeat center;
  margin-right: 6px;
}

.logo-line {
  width: 80px;
  height: 2px;
  background: var(--accent);
  margin: 10px auto;
  opacity: 0.6;
}

.logo-sub {
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

header h1 {
  font-family: "Playfair Display", serif;
  font-size: 2.2rem;
  margin: 0;
  color: var(--accent);
}

.pronunciation {
  margin-top: 6px;
  font-style: italic;
  color: var(--muted);
}

.badge {
  display: inline-block;
  background: rgba(94, 53, 177, 0.15);
  color: var(--accent);
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 600;
  margin-left: 6px;
  vertical-align: middle;
}

section { margin-bottom: 24px; }
h2 {
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}

ul { padding-left: 20px; }
li { margin-bottom: 6px; }

footer {
  text-align: center;
  margin-top: 36px;
  font-size: 0.8rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 16px;
}

.lang { display: none; }
.lang.active { display: block; }

/* Responsive adjustments */
@media (max-width: 600px) {
  main {
    margin: 32px 12px;
    padding: 16px;
  }

  header h1 {
    font-size: 1.8rem;
  }

  .logo-mark {
    font-size: 1.1rem;
  }

  .logo-line {
    width: 60px;
  }

  .btn {
    padding: 4px 10px;
    font-size: 0.75rem;
  }
}
</style>
</head>
<body>
<div class="controls">
  <button class="btn" onclick="toggleTheme()">🌙</button>
  <button class="btn" onclick="setLang('en')">EN</button>
  <button class="btn" onclick="setLang('pl')">PL</button>
</div>

<main>
  <div class="logo">
    <div class="logo-mark"><span class="logo-icon"></span>HADZIUBADZIUNDZIA</div>
    <div class="logo-line"></div>
    <div class="logo-sub">Independent Polish Lexicon</div>
  </div>

  <header>
    <h1>
      hadziubadziundzia
      <span class="badge">noun</span>
    </h1>
    <p class="pronunciation">/had͡ʑu.ba.d͡ʑun.d͡ʑa/</p>
  </header>

  <!-- ENGLISH -->
  <div class="lang lang-en active">
    <!-- sections unchanged -->
  </div>

  <!-- POLISH -->
  <div class="lang lang-pl">
    <!-- sections unchanged, fixed closing <li> -->
    <section>
      <h2>Przykłady użycia</h2>
      <ul>
        <li>„Nie bądź hadziubadziundzia.”</li>
        <li>„Ale z ciebie hadziubadziundzia.”</li>
        <li>„Przestań się tak zachowywać, hadziubadziundzia.”</li>
      </ul>
    </section>
  </div>

  <footer>
    © 2026 Hadziubadziundzia – Independent Polish Lexicon
  </footer>
</main>

<script>
function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}

const savedTheme = localStorage.getItem("theme");
if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);

function setLang(lang) {
  document.querySelectorAll(".lang").forEach(el => el.classList.remove("active"));
  document.querySelector(`.lang-${lang}`).classList.add("active");
  localStorage.setItem("lang", lang);
}

const savedLang = localStorage.getItem("lang") || "en";
setLang(savedLang);
</script>
</body>
</html>
